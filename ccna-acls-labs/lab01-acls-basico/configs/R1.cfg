enable
configure terminal
hostname R1

! Configurar interfaz LAN1
interface GigabitEthernet0/0/0
 ip address 192.168.10.1 255.255.255.0
 no shutdown

! Configurar interfaz WAN hacia R2
interface GigabitEthernet0/0/1
 ip address 172.16.1.1 255.255.255.252
 no shutdown

! Ruta por defecto hacia R2
ip route 0.0.0.0 0.0.0.0 172.16.1.2
end
write 

enable
configure terminal

! 1. Crear la ACL Extendida Nombrada
ip access-list extended FILTRO-LAN1
 10 permit ip host 192.168.10.10 host 10.0.0.100
 20 deny ip host 192.168.10.20 host 10.0.0.100
 30 permit ip any any
exit

! 2. Aplicar la ACL en la interfaz de entrada (cerca del origen)
interface GigabitEthernet0/0/0
 ip access-group FILTRO-LAN1 in
exit

end
write


!Inspección de Contadores en Router R1 (CLI)

R1# show ip access-lists FILTRO-LAN1
Extended IP access list FILTRO-LAN1
    10 permit ip host 192.168.10.10 host 10.0.0.100 (4 matches)
    20 deny ip host 192.168.10.20 host 10.0.0.100 (4 matches)
    30 permit ip any any